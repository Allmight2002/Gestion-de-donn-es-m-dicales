services:
  clamav:
    image: clamav/clamav:stable@sha256:6f4a9e7d616ffc8d1070200fe35ac860735fdd522161a1043f94856e6ee13c28
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      # NB : --ping EXIGE un nombre de tentatives ; sans lui, clamdscan sort en erreur et le
      # conteneur restait unhealthy pour toujours (trouve lors du 1er vrai `compose up`, E2E).
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m

  clamav-scanner:
    build:
      context: ./services/clamav-scanner
    restart: unless-stopped
    environment:
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      CLAMD_TIMEOUT_MS: "30000"
      MAX_SCAN_BYTES: "26214400"
      MAX_CONCURRENT_SCANS: "4"
      SCAN_TOKEN: ${CLAMAV_SCAN_TOKEN:?CLAMAV_SCAN_TOKEN requis}
    depends_on:
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8080"

volumes:
  clamav-db:
