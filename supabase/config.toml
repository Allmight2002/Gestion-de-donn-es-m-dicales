# Configuration Supabase CLI (minimale).
# Generee/mise a jour par `supabase init`. Ajustez major_version au besoin.
# NB: les tests de securite (npm test) n'utilisent PAS ce fichier (Postgres embarque).

project_id = "registre-clinique"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

# Le seed de demonstration (donnees fictives) joue par `supabase db reset`.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Analytics (Logflare) desactive : lourd (Elixir) et inutile pour la demo ; evite un
# conteneur OOM/unhealthy au demarrage sur une machine a memoire Docker limitee.
[analytics]
enabled = false

[auth]
enabled = true
# URL de redirection du frontend (etape 3+).
site_url = "http://127.0.0.1:5173"

# import_map : la carte d'imports des fonctions est le deno.json de la RACINE du depot (imports
# figes, verifies par `npm run release:edge:check`). Le deploiement la passe explicitement
# (`--import-map deno.json`, cf. docs/edge-functions.md et coordinated-release.yml) ; le service
# LOCAL de `supabase start` ne la devine pas et echouait au demarrage du worker
# (« Relative import path "@supabase/supabase-js" not prefixed with / or ./ or ../ »). Le chemin
# est relatif au repertoire `supabase/`. Aucun effet sur le deploiement.

# Fonction Edge signed-read (URL signee AUDITEE). verify_jwt = false car la fonction VERIFIE
# elle-meme l'autorisation (header Authorization + getUser + RLS) ET gere le preflight CORS
# (requete OPTIONS sans auth) : sinon la verification JWT de la plateforme bloquerait le preflight.
[functions.signed-read]
verify_jwt = false
import_map = "../deno.json"

# Fonction Edge inspect-upload (inspection antivirus). verify_jwt = false pour laisser passer le
# preflight CORS ; la fonction verifie elle-meme le header Authorization + RLS.
[functions.inspect-upload]
verify_jwt = false
import_map = "../deno.json"

# Finalisation serveur apres preuve de l'objet Storage exact.
[functions.finalize-upload]
verify_jwt = false
import_map = "../deno.json"

# Nettoyage serveur des uploads orphelins apres echec d'insertion metier.
[functions.cleanup-upload]
verify_jwt = false
import_map = "../deno.json"

# Generation serveur des exports scientifiques conserves.
[functions.generate-export]
verify_jwt = false
import_map = "../deno.json"

# Reconciliation operationnelle des mouvements de quarantaine incomplets.
[functions.reconcile-quarantine]
verify_jwt = false
import_map = "../deno.json"

# Comptes de mission : creation du compte Auth (role saisisseur) + envoi du courriel de
# definition de mot de passe. Le JWT du medecin est verifie DANS la fonction.
[functions.create-mission-account]
verify_jwt = false
import_map = "../deno.json"
