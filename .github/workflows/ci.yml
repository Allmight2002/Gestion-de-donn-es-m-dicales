name: CI

# Filet de securite : a chaque push sur main et a chaque pull request, on verifie le
# typage, on lance toute la suite (RLS sur PostgreSQL EMBARQUE + rendu UI) et on construit
# le bundle PWA. Aucun secret requis : les tests n'utilisent ni Docker ni Supabase.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -shellcheck= -pyflakes=

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: '2.9.2'

      - name: Install dependencies
        run: npm ci

      - name: Verify XLSX and browser test versions
        run: npm ls xlsx@0.20.3 @playwright/test@1.61.1 --depth=0 && grep -F 'xlsx-0.20.3/package/xlsx.mjs' deno.json deno.lock && ! grep -F 'npm:xlsx@0.18.5' deno.json deno.lock

      - name: Dependency audit (registry)
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (tournures a risque, regles des hooks React)
        run: npm run lint

      - name: Inspection env preflight
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-public-anon-key-placeholder-123456
          VITE_USE_SIGNED_READ: 'true'
        run: npm run env:check

      - name: Validation de la configuration de PR
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-public-anon-key-placeholder-123456
          VITE_USE_SIGNED_READ: 'true'
          VITE_REQUIRE_SERVER_INSPECTION: 'false'
        run: npm run release:env -- --target=pr

      - name: Migrations applicables depuis zero
        run: npm run db:verify

      - name: Contrat statique des Edge Functions
        run: npm run release:edge:check

      - name: Format des Edge Functions
        run: deno task edge:fmt

      - name: Lint des Edge Functions
        run: deno task edge:lint

      - name: Typage et resolution figee des imports Edge
        run: deno task edge:check

      - name: Tests Deno unitaires et contractuels
        run: deno task edge:test

      - name: Tests (RLS embarque + UI)
        run: npm test

      - name: Build (PWA)
        # §5.7 : le build de production EXIGE la lecture de fichiers auditee (signed-read).
        # Ce n'est pas un secret mais un drapeau de fonctionnalite -> on l'arme pour la CI.
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-public-anon-key-placeholder-123456
          VITE_USE_SIGNED_READ: 'true'
        run: npm run build

      - name: Aucun motif de cle serveur dans le bundle
        # Ferme la classe « erreur de config » (ex. variable service_role prefixee VITE_ par
        # megarde sur Vercel) : un bundle sain ne contient AUCUN de ces motifs (verifie).
        run: |
          if grep -rEn "sb_secret_|service_role|SUPABASE_SERVICE_ROLE_KEY" dist/; then
            echo "::error::Motif de cle serveur detecte dans dist/ — le bundle frontend ne doit jamais embarquer de secret."
            exit 1
          fi
          echo "dist/ : aucun motif de cle serveur"

  # Audit v18 P0 : l'image du scanner ClamAV doit DEMARRER, pas seulement se construire —
  # un COPY manquant dans le Dockerfile ne casse pas `docker build`, seulement le lancement
  # de node (ERR_MODULE_NOT_FOUND). On construit l'image, on la demarre avec un token de
  # test, et on exige une reponse HTTP sur /health (503 attendu : clamd est ABSENT ici,
  # seul le demarrage du serveur est teste ; le verdict antivirus a ses tests unitaires).
  scanner-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Construire l'image du scanner
        run: docker build -t clamav-scanner-ci services/clamav-scanner

      - name: Demarrer le conteneur et exiger une reponse HTTP
        # Boucle de retry (30 s max) : un sleep fixe etait FLAKY sur les runners (HTTP 000
        # observe a froid alors que le meme commit passait sur l autre branche).
        run: |
          docker run -d --name scanner-ci -e SCAN_TOKEN=ci-smoke-token-with-at-least-32-characters -p 8080:8080 clamav-scanner-ci
          code=000
          for i in $(seq 1 30); do
            sleep 1
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health || true)
            if [ "$code" = "503" ] || [ "$code" = "200" ]; then break; fi
          done
          echo "GET /health -> HTTP $code (503 attendu sans clamd)"
          docker ps -a --filter name=scanner-ci --format '{{.Status}}'
          docker logs scanner-ci
          test "$code" = "503" -o "$code" = "200"

      - name: Nettoyage
        if: always()
        run: docker rm -f scanner-ci || true
