name: Continuity backup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Environnement a sauvegarder
        required: true
        type: choice
        options: [staging, production, all]

permissions:
  contents: read

jobs:
  backup:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name == 'schedule' || inputs.target == 'all') && '["staging","production"]' || format('["{0}"]', inputs.target)) }}
    environment: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: continuity-backup-${{ matrix.target }}
      cancel-in-progress: false
    env:
      BACKUP_TARGET: ${{ matrix.target }}
      CONTINUITY_BACKUP_ENABLED: ${{ vars.CONTINUITY_BACKUP_ENABLED }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STORAGE_BACKUP_ENCRYPTION_KEY: ${{ secrets.STORAGE_BACKUP_ENCRYPTION_KEY }}
      BACKUP_REQUIRE_SESSION_POOLER: 'true'
      BACKUP_PREPARE_DUMP_IMAGE: 'true'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Require an explicitly enabled continuity policy
        shell: bash
        run: |
          set -euo pipefail
          test "$CONTINUITY_BACKUP_ENABLED" = "true"
          npm run release:target -- --target="$BACKUP_TARGET"

      - name: Create and verify the encrypted DB and Storage backup
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/continuity-backup-$BACKUP_TARGET-$GITHUB_RUN_ID"
          echo "BACKUP_SET_DIR=$backup_dir" >> "$GITHUB_ENV"
          npm run backup:coordinated -- --target="$BACKUP_TARGET" --output="$backup_dir"
          npm run backup:coordinated:verify -- --backup="$backup_dir"

      - name: Preserve the verified encrypted backup outside the runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: continuity-backup-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ env.BACKUP_SET_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove the runner copy
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/continuity-backup-$BACKUP_TARGET-$GITHUB_RUN_ID"
