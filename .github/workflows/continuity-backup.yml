name: Continuity backup

on:
  schedule:
    - cron: '17 2,14 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Environnement a sauvegarder
        required: true
        type: choice
        options: [staging, production, all]
      alert_test:
        description: Envoyer une alerte synthetique pour la cible choisie
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backup:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'schedule' && (vars.CONTINUITY_PRODUCTION_SCHEDULE_ENABLED == 'true' && '["staging","production"]' || '["staging"]') || (inputs.target == 'all' && '["staging","production"]' || format('["{0}"]', inputs.target))) }}
    environment: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: continuity-backup-${{ matrix.target }}
      cancel-in-progress: false
    env:
      BACKUP_TARGET: ${{ matrix.target }}
      CONTINUITY_BACKUP_ENABLED: ${{ vars.CONTINUITY_BACKUP_ENABLED }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STORAGE_BACKUP_ENCRYPTION_KEY: ${{ secrets[vars.BACKUP_KEY_SECRET_NAME || (matrix.target == 'staging' && 'STORAGE_BACKUP_ENCRYPTION_KEY_20260723' || 'STORAGE_BACKUP_ENCRYPTION_KEY')] }}
      BACKUP_KEY_ID: ${{ vars.BACKUP_KEY_ID || (matrix.target == 'staging' && 'staging-20260723' || '') }}
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
      BACKUP_REQUIRE_SESSION_POOLER: 'true'
      BACKUP_PREPARE_DUMP_IMAGE: 'true'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Require an explicitly enabled continuity policy
        shell: bash
        run: |
          set -euo pipefail
          test "$CONTINUITY_BACKUP_ENABLED" = "true"
          node scripts/continuity-policy.mjs
          npm run release:target -- --target="$BACKUP_TARGET"

      - name: Require the backup alert destination
        env:
          MONITOR_TARGET: ${{ matrix.target }}
          MONITOR_ALERT_WEBHOOK_URL: ${{ secrets.MONITOR_ALERT_WEBHOOK_URL }}
        run: node scripts/send-operations-alert.mjs --check-config

      - name: Create and verify the encrypted DB and Storage backup
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/continuity-backup-$BACKUP_TARGET-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "BACKUP_SET_DIR=$backup_dir" >> "$GITHUB_ENV"
          npm run backup:coordinated -- --target="$BACKUP_TARGET" --output="$backup_dir"
          npm run backup:coordinated:verify -- --backup="$backup_dir"

      - name: Preserve the verified encrypted backup outside the runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: continuity-backup-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BACKUP_SET_DIR }}
          if-no-files-found: error
          retention-days: ${{ env.BACKUP_RETENTION_DAYS }}

      - name: Remove the runner copy
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/continuity-backup-$BACKUP_TARGET-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  preserve-copy:
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'schedule' && (vars.CONTINUITY_PRODUCTION_SCHEDULE_ENABLED == 'true' && '["staging","production"]' || '["staging"]') || (inputs.target == 'all' && '["staging","production"]' || format('["{0}"]', inputs.target))) }}
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the verified encrypted backup
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: continuity-backup-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-backup

      - name: Preserve the backup as an immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          tag="continuity-${BACKUP_TARGET}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="$RUNNER_TEMP/${tag}.tar.gz"
          asset_name="${tag}.tar.gz"
          backup_dir="$RUNNER_TEMP/encrypted-backup"
          trap 'rm -rf -- "$archive" "$backup_dir"' EXIT
          tar -czf "$archive" -C "$backup_dir" .
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"

          gh release create "$tag" "$archive#$asset_name" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "MedData ${BACKUP_TARGET} continuity backup ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --notes "Encrypted and HMAC-verified ${BACKUP_TARGET} backup. Run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}, commit ${GITHUB_SHA}, archive SHA-256 ${archive_sha256}. No plaintext is published."
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest=false

          release_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          # The repository-setting endpoint requires administrative access that the
          # workflow token deliberately does not have. Prove immutability on the
          # published release itself instead.
          test "$(jq -r '.immutable' <<<"$release_json")" = "true"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$GITHUB_SHA"
          test "$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")" = "sha256:$archive_sha256"

  alert:
    if: ${{ always() }}
    needs: [backup, preserve-copy]
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'schedule' && (vars.CONTINUITY_PRODUCTION_SCHEDULE_ENABLED == 'true' && '["staging","production"]' || '["staging"]') || (inputs.target == 'all' && '["staging","production"]' || format('["{0}"]', inputs.target))) }}
    environment: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Assess this target and deliver a redacted alert independently
        env:
          GH_TOKEN: ${{ github.token }}
          MONITOR_TARGET: ${{ matrix.target }}
          MONITOR_ALERT_WEBHOOK_URL: ${{ secrets.MONITOR_ALERT_WEBHOOK_URL }}
          MONITOR_ALERT_DRILL: ${{ inputs.alert_test == true && 'true' || 'false' }}
        run: node scripts/send-continuity-alert.mjs
