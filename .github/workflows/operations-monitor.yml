name: Operations monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      alert_test:
        description: Envoyer aussi une alerte synthetique expurgee
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: '55.0.0'
  DO_NOT_TRACK: '1'

concurrency:
  group: operations-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    strategy:
      fail-fast: false
      matrix:
        target: [staging, production]
    environment: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MONITOR_TARGET: ${{ matrix.target }}
      MONITOR_APP_URL: ${{ vars.APP_URL }}
      # Parcours antivirus suspendu par defaut (decision du 12 aout 2026). Poser la variable
      # de depot INSPECTION_MODE=strict retablit les sondes ClamAV sans autre modification.
      INSPECTION_MODE: ${{ vars.INSPECTION_MODE || 'paused' }}
      MONITOR_REQUIRE_STRICT_INSPECTION: ${{ (vars.INSPECTION_MODE || 'paused') == 'strict' && 'true' || 'false' }}
      MONITOR_MAX_SIGNATURE_AGE_HOURS: '48'
      MONITOR_OUTPUT: monitor-evidence-${{ matrix.target }}.json
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CLAMAV_SCAN_URL: ${{ secrets.CLAMAV_SCAN_URL }}
      CLAMAV_SCAN_TOKEN: ${{ secrets.CLAMAV_SCAN_TOKEN }}
      MONITOR_ALERT_WEBHOOK_URL: ${{ secrets.MONITOR_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Require an HTTPS alert destination
        run: node scripts/send-operations-alert.mjs --check-config

      - name: Bootstrap scoped Vercel monitoring cookie
        if: matrix.target == 'staging'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is required}"
          control_dir="$RUNNER_TEMP/vercel-monitor-control"
          cookie_jar="$RUNNER_TEMP/vercel-monitor.cookies"
          storage_state="$RUNNER_TEMP/vercel-monitor-storage.json"
          mkdir -p "$control_dir/.vercel"
          CONTROL_PROJECT_FILE="$control_dir/.vercel/project.json" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const output = process.env.CONTROL_PROJECT_FILE;
          const orgId = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          if (!output || !orgId || !projectId) throw new Error('Configuration Vercel staging incomplete.');
          writeFileSync(output, JSON.stringify({
            orgId,
            projectId,
            projectName: 'gestion-de-donn-es-m-dicales',
          }), { mode: 0o600 });
          NODE
          (
            cd "$control_dir"
            npx --yes "vercel@$VERCEL_CLI_VERSION" curl /login \
              --deployment "$MONITOR_APP_URL" --yes -- \
              --silent --show-error --fail --location \
              --cookie-jar "$cookie_jar" --output /dev/null \
              --header "x-vercel-set-bypass-cookie: true"
          )
          node "$GITHUB_WORKSPACE/scripts/vercel-cookie-state.mjs" \
            "$cookie_jar" "$storage_state" "$MONITOR_APP_URL"
          rm -f "$cookie_jar"
          echo "MONITOR_FRONTEND_STORAGE_STATE=$storage_state" >> "$GITHUB_ENV"

      - name: Probe application, Supabase and (in strict mode) the antivirus
        id: probe
        continue-on-error: true
        run: node scripts/operations-monitor.mjs

      - name: Deliver the redacted failure alert
        if: steps.probe.outcome == 'failure'
        run: node scripts/send-operations-alert.mjs --file="$MONITOR_OUTPUT"

      - name: Exercise alert delivery on explicit request
        if: inputs.alert_test == true
        env:
          MONITOR_ALERT_DRILL: 'true'
        run: node scripts/send-operations-alert.mjs --file="$MONITOR_OUTPUT"

      - name: Preserve the monitor failure after alerting
        if: steps.probe.outcome == 'failure'
        run: exit 1

      - name: Remove ephemeral Vercel monitoring state
        if: always() && matrix.target == 'staging'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/vercel-monitor.cookies"
          rm -f "$RUNNER_TEMP/vercel-monitor-storage.json"
          rm -f "$RUNNER_TEMP/vercel-monitor-control/.vercel/project.json"

      - name: Preserve redacted monitoring evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-monitor-${{ matrix.target }}-${{ github.run_id }}
          path: monitor-evidence-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 30
