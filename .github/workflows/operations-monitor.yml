name: Operations monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    strategy:
      fail-fast: false
      matrix:
        target: [staging, production]
    environment: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MONITOR_TARGET: ${{ matrix.target }}
      MONITOR_APP_URL: ${{ vars.APP_URL }}
      MONITOR_REQUIRE_STRICT_INSPECTION: 'true'
      MONITOR_OUTPUT: monitor-evidence-${{ matrix.target }}.json
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CLAMAV_SCAN_URL: ${{ secrets.CLAMAV_SCAN_URL }}
      CLAMAV_SCAN_TOKEN: ${{ secrets.CLAMAV_SCAN_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Probe application, Supabase and strict antivirus
        run: node scripts/operations-monitor.mjs

      - name: Preserve redacted monitoring evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-monitor-${{ matrix.target }}-${{ github.run_id }}
          path: monitor-evidence-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 30
